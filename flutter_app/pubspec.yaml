name: nujoom
description: "Nujoom - an original early-learning game app for kids, built with Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State, DI, routing
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ">=2.0.5 <4.0.0"
  get_it: ">=8.0.0 <10.0.0"
  go_router: ">=14.0.0 <19.0.0"
  dartz: ^0.10.1

  # Storage (non-sensitive settings and progress only)
  shared_preferences: ^2.3.0

  # Audio
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/content/
    - assets/audio/
    - assets/art/

  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
